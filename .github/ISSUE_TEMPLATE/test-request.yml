---
name: Test Request
description: Explain the engineering need, requested data and planned analysis.
title: "[TEST] "
labels:
- testing:needs-review
body:
- type: markdown
  attributes:
    value: |-
      Explain what you want to learn, what data you need and how you intend to use it. A complete procedure or instrumentation design is not required.

      **Answer as much as you can.** Supporting questions are optional when you need help: write **Unknown / need help** and explain the uncertainty, or leave the field blank. Leads and relevant technical teams can work through these details together. Providing complete, well-supported answers upfront reduces follow-up and improves the chance that testing can be prepared and carried out sooner, subject to priorities, resources and readiness.

      The requesting Subsystem Lead remains involved in planning and preparation on this issue. **Managers' approval does not mean ready or scheduled, guarantee the requested date, or authorize vehicle operation.**
- type: textarea
  id: question
  attributes:
    label: "What engineering question will this test answer?"
    description: "Describe the problem and the design, tuning, validation or competition decision the results will support. What would you do differently depending on the result? What is the consequence of not testing?"
  validations:
    required: true
- type: textarea
  id: requirements
  attributes:
    label: "Which existing requirement(s) does this relate to?"
    description: "Give requirement names from the team's existing requirements document, or N/A."
  validations:
    required: false
- type: textarea
  id: measurements
  attributes:
    label: "What measurements do you need, and why?"
    description: "For each quantity, identify the component/location, why it is needed, and whether it is essential or optional. Include expected ranges or required accuracy if known. Mention available or proposed equipment if useful; sensor selection is not required."
  validations:
    required: false
- type: textarea
  id: processing
  attributes:
    label: "How will you process the data and calculate the results you need?"
    description: "Describe the path from measurements to the final result: calculations, comparisons, models or processing steps. Explain how measurements must be combined or synchronized. Equations, sketches and links are welcome. If uncertain, explain what help you need."
  validations:
    required: false
- type: textarea
  id: outputs
  attributes:
    label: "What output will make the test useful, and how will you judge the result?"
    description: "Describe the final graph, calculated value, comparison, model input or other deliverable. What finding would support your decision? State a target or acceptance criterion if known, or explain what an exploratory test should characterize."
  validations:
    required: false
- type: textarea
  id: analysis_owner_timing
  attributes:
    label: "Who will analyse the data, and when are usable results needed?"
    description: "Name the person or subsystem responsible for processing and interpretation, and support needed. Give the usable-results deadline (YYYY-MM-DD, or an approximate window including the year), the milestone it supports and its flexibility. Allow time for analysis; state an earlier testing deadline if needed."
  validations:
    required: false
- type: textarea
  id: method
  attributes:
    label: "What is your proposed testing method?"
    description: "Identify the vehicle/year, component or bench setup; what will happen; configurations or conditions to compare; proposed location; and approximate duration or number of runs if known. A finished procedure is not required."
  validations:
    required: false
- type: textarea
  id: measurement_speed
  attributes:
    label: "What brief events or changes must the measurements capture?"
    description: "Describe the fastest meaningful event and its approximate duration or frequency, if known, with the basis for your estimate. Say if timing is unimportant. You do not need to select a sampling rate."
  validations:
    required: false
- type: textarea
  id: preparation
  attributes:
    label: "What preparation is needed, and what can your subsystem contribute?"
    description: "List known repairs, modifications, installation, access/disassembly, fixtures, calibration work and equipment needs. Identify what is available, what your subsystem can prepare and where help is needed. Include availability or scheduling constraints. A complete calibration plan is not required."
  validations:
    required: false
