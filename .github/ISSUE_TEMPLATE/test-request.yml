---
name: Test Request
description: Explain the engineering need, requested data and planned analysis.
title: "[TEST] "
labels:
- testing:needs-review
body:
- type: markdown
  attributes:
    value: "Explain the engineering question, requested data and how the results will be used. Testing is responsible for collecting the agreed data and handing it over to the requesting subsystem. The requesting subsystem is responsible for processing, analysis and interpretation. Analysis questions below help you plan the measurements and work backward to a raw-data delivery deadline. A complete procedure or instrumentation design is not required.\n\nRequired questions need a response, but technical uncertainty is welcome: write **Unknown / need help** and explain what is unresolved. Leads and relevant technical teams can work through it together. Providing complete, well-supported answers upfront reduces follow-up and improves the chance of testing sooner, subject to priorities, resources and readiness.\n\nThe requesting Subsystem Lead remains involved in planning and preparation on this issue. **Managers' approval does not mean ready or scheduled, guarantee the requested date, or authorize vehicle operation.**"
- type: textarea
  id: question
  attributes:
    label: "What are you trying to determine?"
    description: "Explain the engineering question, the decision the results will support and what you would do differently depending on the result."
  validations:
    required: true
- type: input
  id: requirements
  attributes:
    label: "Which existing requirement(s) does this relate to?"
    description: "Give names from the team's requirements document, or N/A."
  validations:
    required: false
- type: textarea
  id: measurements
  attributes:
    label: "What measurements are essential, and why?"
    description: "For each quantity, identify the component/location and why it is needed. List optional extras separately. Include expected minimum/maximum values and accuracy needs if known. Sensor models are not required. If uncertain, explain what needs help."
  validations:
    required: true
- type: textarea
  id: processing
  attributes:
    label: "How will your subsystem use and analyse the data?"
    description: "Describe your subsystem's planned analysis after receiving the data: calculations, comparisons, models or processing steps. Note measurements that must be combined or synchronized. If you need help, explain what is unresolved."
  validations:
    required: true
- type: textarea
  id: outputs
  attributes:
    label: "What result will your subsystem produce from the data?"
    description: "Name the graph, value, comparison or model input your subsystem will produce and use. This describes your analysis goal, not a deliverable expected from Testing. Explain how you will judge the result; include a target if known, or what an exploratory test should characterize."
  validations:
    required: true
- type: input
  id: analysis_owner
  attributes:
    label: "Who in your subsystem will own the analysis?"
    description: "Name the person or group in the requesting subsystem responsible for processing and interpretation. If not assigned, say so and identify who will arrange it. Planning guidance does not transfer analysis responsibility to Testing."
  validations:
    required: true
- type: input
  id: vehicle
  attributes:
    label: "Which vehicle or setup will be used?"
    description: "Give the vehicle/year, component or bench setup. If undecided, identify the options or help needed."
  validations:
    required: true
- type: dropdown
  id: location
  attributes:
    label: "Proposed location?"
    description: "If choosing Other, specify it in the testing method."
    options:
    - "MEDN"
    - "Courtyard"
    - "ENA"
    - "Other"
    - "Need help deciding"
  validations:
    required: true
- type: textarea
  id: method
  attributes:
    label: "What is the proposed test method?"
    description: "Briefly describe what will happen and configurations or conditions to compare. Include duration or number of runs if known. A preliminary idea is enough; if you need help, explain with what."
  validations:
    required: true
- type: textarea
  id: measurement_speed
  attributes:
    label: "What brief events or changes must be captured?"
    description: "Describe the fastest meaningful event, its approximate duration/frequency and the basis for your estimate, if known. Say if timing is unimportant. You do not need to select a sampling rate."
  validations:
    required: false
- type: textarea
  id: preparation
  attributes:
    label: "What preparation remains?"
    description: "List known repairs, modifications, installation, disassembly, fixtures, equipment or calibration work. State what your subsystem can contribute and where help is needed. Include availability constraints. None known is acceptable; a complete calibration plan is not required."
  validations:
    required: true
- type: input
  id: analysis_due
  attributes:
    label: "When must your analysis be finished?"
    description: "Enter YYYY-MM-DD, or No fixed deadline. This is your subsystem's deadline for interpreted results to support the engineering decision."
  validations:
    required: true
- type: textarea
  id: date_reason
  attributes:
    label: "What makes that analysis deadline necessary?"
    description: "Name the actual decision or milestone (design freeze, order, competition, etc.) and explain what would be delayed or change if analysis finished later. Next testing day alone is not an engineering deadline justification. If this is only a preference or there is no fixed deadline, say so."
  validations:
    required: true
- type: input
  id: analysis_duration
  attributes:
    label: "How much time will your subsystem need for analysis?"
    description: "Estimate the elapsed time between receiving the raw data and finishing analysis, allowing for availability and processing work (for example, one week). If uncertain, give a provisional estimate or explain what needs planning."
  validations:
    required: true
- type: input
  id: need_by
  attributes:
    label: "By when do you need Testing to deliver the raw/unprocessed data?"
    description: "Enter YYYY-MM-DD, or No fixed deadline. Work backward from your analysis deadline using the time estimated above, allowing margin for setbacks. This is the data-handoff date used to plan testing, not the analysis completion date. Explain any different constraint."
  validations:
    required: true
- type: dropdown
  id: deadline_flexibility
  attributes:
    label: "Can the raw-data delivery deadline move?"
    description: "Choose whether the raw-data handoff date is a firm constraint or a preference. Explain any limits in the deadline justification above."
    options:
    - "Fixed"
    - "Some flexibility"
    - "Preferred date only"
    - "No fixed deadline"
  validations:
    required: true
