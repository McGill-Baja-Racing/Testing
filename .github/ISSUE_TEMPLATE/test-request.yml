---
name: Test request
description: Subsystem Lead submits an engineering test for screening and individual
  approval.
title: "[TEST] "
labels:
- test-request
body:
- type: markdown
  attributes:
    value: Formal requests are submitted by a Subsystem Lead. Submission is not approval.
      Managers approve test value individually; resource managers confirm capacity
      before Managers authorize preparation. Readiness and final joint go/no-go are
      separate. Describe physical needs; instrumentation details come later.
- type: input
  id: subsystem
  attributes:
    label: Requesting subsystem and Subsystem Lead
    description: Name the responsible Subsystem Lead; other members suggest tests
      through their lead.
  validations:
    required: true
- type: dropdown
  id: purpose
  attributes:
    label: Test purpose
    options:
    - Verification
    - Validation
    - Characterization
    - Comparison
    - Diagnostics
    - Durability
    - Integration
    - Other
  validations:
    required: true
- type: textarea
  id: question
  attributes:
    label: Engineering question
    description: A definite question; exploratory work does not need a forced hypothesis.
  validations:
    required: true
- type: textarea
  id: measurements
  attributes:
    label: Physical measurements and expected outputs
    description: Describe physical quantities, operating conditions and outputs; do
      not invent sensor specifications.
  validations:
    required: true
- type: textarea
  id: decision
  attributes:
    label: Intended engineering decision and sufficient evidence
    description: What decision will change and why does testing matter? What evidence
      answers the question? Include relevant criteria and basis, or identify what
      still needs definition.
  validations:
    required: true
- type: textarea
  id: consequences
  attributes:
    label: Consequences of not testing
  validations:
    required: true
- type: input
  id: requirements
  attributes:
    label: Requirement IDs and references
    description: Optional DVP&R IDs, calculations or design links.
- type: input
  id: timing
  attributes:
    label: Requested and last useful timing
    description: Preferred date/window and latest useful date with reason. If unknown,
      state the decision milestone; this is not a confirmed booking.
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Known hazards, constraints and context
    description: Optional; technical complexity and operational safety risk are assessed
      separately.
